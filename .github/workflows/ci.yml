name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here publishes anything, so the token can do nothing but read.
permissions:
  contents: read

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs, not tags, as in the API repo: a tag like
# v4 is mutable and the upstream owner can repoint it. The trailing comment
# records which release each SHA was, since a bare SHA says nothing.
jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Checkout otherwise leaves the job's token in .git/config for
          # everything that runs afterwards, and `pnpm install` runs lifecycle
          # scripts — sharp's native build is explicitly allowed here. Nothing
          # in this workflow talks to git over the network, and no dependency
          # is fetched from a repository, so the credential has no use.
          persist-credentials: false

      # Must come before setup-node: its pnpm cache needs pnpm on PATH.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The suite pins TZ itself, so a UTC runner does not quietly make the
      # timezone tests vacuous.
      - name: Test
        run: pnpm test

  build:
    name: production build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Checkout otherwise leaves the job's token in .git/config for
          # everything that runs afterwards, and `pnpm install` runs lifecycle
          # scripts — sharp's native build is explicitly allowed here. Nothing
          # in this workflow talks to git over the network, and no dependency
          # is fetched from a repository, so the credential has no use.
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `next build` prerenders the home page, which fetches listings — so a
      # build with nothing to talk to fails on a connection refused rather
      # than on anything about this code.
      #
      # A stub, not the real API. Standing the API up here would mean its
      # repository, Postgres and Redis in a workflow that is meant to answer
      # one question: does this app compile and render. What this cannot catch
      # is a contract change, and `schema.d.ts` being generated from the real
      # document is what covers that.
      - name: Stub the API for prerendering
        run: |
          cat > /tmp/stub-api.mjs <<'JS'
          import { createServer } from "node:http";

          const empty = {
            data: [],
            meta: { page: 1, limit: 20, total: 0, totalPages: 0 },
          };

          createServer((req, res) => {
            res.writeHead(200, { "content-type": "application/json" });
            res.end(JSON.stringify(empty));
          }).listen(9999, () => console.log("stub API on :9999"));
          JS
          node /tmp/stub-api.mjs &
          # Fail here rather than inside the build, where the cause is buried.
          for i in $(seq 1 20); do
            curl -sf http://localhost:9999/properties >/dev/null && exit 0
            sleep 1
          done
          echo "stub API did not start" >&2
          exit 1

      - name: Build
        run: pnpm build
        env:
          API_ORIGIN: http://localhost:9999
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/hbserenity
