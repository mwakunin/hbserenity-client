</div>
<div class="relative">
<input class="peer w-full h-14 bg-surface-container-low rounded-xl px-4 pt-4 pb-1 text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary/20 transition-shadow placeholder-transparent" id="email" placeholder="Email Address" type="email"/>

<input checked="" class="peer sr-only" name="payment_method" type="radio" value="mpesa"/>

</div>
<div class="w-10 h-10 rounded-lg bg-green-500/10 flex items-center justify-center">
<span class="material-symbols-outlined text-green-600">smartphone</span>
</div>
<!-- Selected state ring -->
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary/40 pointer-events-none transition-colors"></div>
</label>
<!-- Card Option -->
<label class="relative flex items-center p-4 rounded-xl bg-surface-container-low cursor-pointer group transition-colors hover:bg-surface-container">
<input class="peer sr-only" name="payment_method" type="radio" value="card"/>
<div class="w-6 h-6 rounded-full border-2 border-outline flex items-center justify-center mr-4 peer-checked:border-primary peer-checked:bg-primary transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-on-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
<div class="flex-grow flex flex-col">
<span class="font-body-md text-body-md text-on-surface">Credit / Debit Card</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Visa, Mastercard, Amex</span>
</div>
<div class="w-10 h-10 rounded-lg bg-primary/5 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">credit_card</span>
</div>

</span>
</button>
<!-- Expanded Details (Hidden by default) -->
<div class="overflow-hidden transition-all duration-300 max-h-0 opacity-0 mb-4 flex flex-col gap-2" id="breakdownContent">

<span class="font-body-md text-body-md text-on-surface-variant">KES 25,000 x 3 nights</span>
<span class="font-body-md text-body-md text-on-surface">KES 75,000</span>
</div>
<div class="flex justify-between items-center py-1">
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1">

</span>
<span class="font-body-md text-body-md text-on-surface">KES 1,500</span>
</div>
<div class="flex justify-between items-center py-1">
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1">

</span>
<span class="font-body-md text-body-md text-on-surface">KES 500</span>
</div>
<div class="h-[1px] w-full bg-outline-variant/30 my-2"></div>
</div>
<!-- Total & Action -->
<div class="flex items-center justify-between pb-4">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Total Amount</span>
<span class="font-headline-md-mobile text-headline-md-mobile text-on-surface font-bold">KES 77,000</span>
</div>
<button class="h-14 px-8 rounded-full bg-[#FF7F50] text-white font-label-md text-label-md shadow-md active:scale-95 transition-transform flex items-center gap-2">
<span class="material-symbols-outlined text-[20px] pb-[2px]" style="font-variation-settings: 'FILL' 1;">lock</span>
              Confirm &amp; Pay
          </button>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('breakdownToggle');
        const content = document.getElementById('breakdownContent');
        const icon = document.getElementById('breakdownIcon');
        let isExpanded = false;

        toggleBtn.addEventListener('click', () => {
            isExpanded = !isExpanded;
            if (isExpanded) {
                content.style.maxHeight = content.scrollHeight + "px";
                content.style.opacity = "1";
                icon.style.transform = "rotate(180deg)";
            } else {
                content.style.maxHeight = "0px";
                content.style.opacity = "0";
                icon.style.transform = "rotate(0deg)";
            }
        });

        // Simple radio selection styling updates
        const radios = document.querySelectorAll('input[name="payment_method"]');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                radios.forEach(r => {
                    const parent = r.closest('label');
                    if(r.checked) {
                        parent.classList.add('bg-surface-container');
                        parent.classList.remove('bg-surface-container-low');
                        parent.classList.add('border-primary/20');
                        parent.classList.add('border-[1.5px]');
                    } else {
                        parent.classList.remove('bg-surface-container');
                        parent.classList.add('bg-surface-container-low');
                        parent.classList.remove('border-primary/20');
                        parent.classList.remove('border-[1.5px]');
                    }
                })
            })
        });
    });
</script></main></body></html>
